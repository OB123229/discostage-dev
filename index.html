<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Discover Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:#1a0533;color:#fff;overflow:hidden;letter-spacing:0.01em}
input,button{font-family:inherit}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
@keyframes spin    {to{transform:rotate(360deg)}}
@keyframes fadeIn  {from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes floatUp {from{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}to{transform:translateY(-100px) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div id="root"></div>

<!-- !! Load order matters — don't rearrange !! -->

<!-- 1. Shared values (colors, fonts) -->
<script type="text/babel" src="js/styles.js"></script>

<!-- 2. Mock data (events, artists, towns) -->
<script type="text/babel" src="js/data.js"></script>

<!-- 3. Shared UI components -->
<script type="text/babel" src="js/components/ui.js"></script>
<script type="text/babel" src="js/components/tabbar.js"></script>

<!-- 4. Onboarding pages -->
<script type="text/babel" src="js/pages/welcome.js"></script>
<script type="text/babel" src="js/pages/auth.js"></script>
<script type="text/babel" src="js/pages/location.js"></script>
<script type="text/babel" src="js/pages/role.js"></script>

<!-- 5. Main app pages -->
<script type="text/babel" src="js/pages/home.js"></script>
<script type="text/babel" src="js/pages/explore.js"></script>
<script type="text/babel" src="js/pages/search.js"></script>
<script type="text/babel" src="js/pages/profile.js"></script>

<!-- 6. App core — always last -->
<script type="text/babel" src="js/app.js"></script>

</body>
</html>
